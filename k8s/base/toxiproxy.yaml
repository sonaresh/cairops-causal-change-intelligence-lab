apiVersion: apps/v1
kind: Deployment
metadata: {name: toxiproxy, namespace: cairops-lab}
spec:
  replicas: 1
  selector: {matchLabels: {app: toxiproxy}}
  template:
    metadata: {labels: {app: toxiproxy}}
    spec:
      containers:
      - name: toxiproxy
        image: ghcr.io/shopify/toxiproxy:2.12.0
        ports: [{containerPort: 8474}, {containerPort: 8666}]
---
apiVersion: v1
kind: Service
metadata: {name: toxiproxy, namespace: cairops-lab}
spec:
  selector: {app: toxiproxy}
  ports:
  - {name: api, port: 8474, targetPort: 8474}
  - {name: proxy, port: 8666, targetPort: 8666}
