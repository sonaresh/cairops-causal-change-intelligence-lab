apiVersion: v1
kind: Secret
metadata: {name: postgres-secret, namespace: cairops-lab}
type: Opaque
stringData: {POSTGRES_PASSWORD: "cairops-lab-only"}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: cairops-lab}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        envFrom: [{secretRef: {name: postgres-secret}}]
        ports: [{containerPort: 5432}]
        resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: cairops-lab}
spec: {selector: {app: postgres}, ports: [{port: 5432, targetPort: 5432}]}
