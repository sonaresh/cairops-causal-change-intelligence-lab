apiVersion: apps/v1
kind: Deployment
metadata: {name: service-b, namespace: cairops-lab}
spec:
  replicas: 2
  selector: {matchLabels: {app: service-b}}
  template:
    metadata: {labels: {app: service-b}}
    spec:
      containers:
      - name: service-b
        image: SERVICE_B_IMAGE
        ports: [{containerPort: 8080}]
        env:
        - {name: DELAY_MS, value: "15"}
        - {name: FAIL_RATE, value: "0"}
        - {name: MEMORY_MB, value: "0"}
        - {name: API_VERSION, value: "1"}
        - {name: USE_DB, value: "0"}
        - {name: DB_DELAY_MS, value: "0"}
        resources: {requests: {cpu: 100m, memory: 96Mi}, limits: {cpu: 500m, memory: 192Mi}}
        readinessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 2, periodSeconds: 3}
        livenessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 10, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: service-b, namespace: cairops-lab}
spec: {selector: {app: service-b}, ports: [{port: 8080, targetPort: 8080}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: service-b-hot, namespace: cairops-lab}
spec:
  replicas: 1
  selector: {matchLabels: {app: service-b-hot}}
  template:
    metadata: {labels: {app: service-b-hot}}
    spec:
      containers:
      - name: service-b
        image: SERVICE_B_IMAGE
        ports: [{containerPort: 8080}]
        env:
        - {name: DELAY_MS, value: "850"}
        - {name: FAIL_RATE, value: "0"}
        - {name: API_VERSION, value: "1"}
        resources: {requests: {cpu: 100m, memory: 96Mi}, limits: {cpu: 500m, memory: 192Mi}}
        readinessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 2, periodSeconds: 3}
---
apiVersion: v1
kind: Service
metadata: {name: service-b-hot, namespace: cairops-lab}
spec: {selector: {app: service-b-hot}, ports: [{port: 8080, targetPort: 8080}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: service-a, namespace: cairops-lab}
spec:
  replicas: 2
  selector: {matchLabels: {app: service-a}}
  template:
    metadata: {labels: {app: service-a}}
    spec:
      containers:
      - name: service-a
        image: SERVICE_A_IMAGE
        ports: [{containerPort: 8080}]
        env:
        - {name: SERVICE_B_URL, value: "http://service-b:8080/work"}
        - {name: HOT_SERVICE_B_URL, value: "http://service-b-hot:8080/work"}
        - {name: ROUTE_HOT_PERCENT, value: "0"}
        - {name: EXPECTED_API_VERSION, value: "1"}
        - {name: RETRIES, value: "1"}
        - {name: TIMEOUT_S, value: "1.0"}
        resources: {requests: {cpu: 100m, memory: 96Mi}, limits: {cpu: 500m, memory: 192Mi}}
        readinessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 2, periodSeconds: 3}
        livenessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 10, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: service-a, namespace: cairops-lab}
spec: {selector: {app: service-a}, ports: [{port: 8080, targetPort: 8080}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: cairops-lab}
spec:
  replicas: 2
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
      - name: frontend
        image: FRONTEND_IMAGE
        ports: [{containerPort: 8080}]
        env:
        - {name: SERVICE_A_URL, value: "http://service-a:8080/work"}
        - {name: TIMEOUT_S, value: "1.5"}
        - {name: MEMORY_MB, value: "0"}
        - {name: CPU_BURN_MS, value: "0"}
        resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 600m, memory: 256Mi}}
        readinessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 2, periodSeconds: 3}
        livenessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 10, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: cairops-lab}
spec:
  type: LoadBalancer
  selector: {app: frontend}
  ports: [{port: 80, targetPort: 8080}]
