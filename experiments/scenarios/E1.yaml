id: E1
type: deployment
target: deployment/service-b
description: Application deployment with progressive memory growth

expected_path:
  - deployment
  - memory_pressure
  - pod_eviction
  - retry_rate
  - api_errors

risk_context:
  memory_limit_mb: 192
  growth_reference_mb: 10

safe:
  patch_env:
    deployment: service-b
    MEMORY_MB: '0'
    MEMORY_GROWTH_MB: '0'

failure:
  patch_env:
    deployment: service-b
    MEMORY_MB: '175'
    MEMORY_GROWTH_MB: '10'

governed:
  patch_env:
    deployment: service-b
    MEMORY_MB: '70'
    MEMORY_GROWTH_MB: '5'